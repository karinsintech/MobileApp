name: React Native iOS Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    env:
      TEAM_ID: 769D8U522H
      BUNDLE_ID: com.karins
      KEYCHAIN_PASSWORD: github-actions-keychain

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Install CocoaPods
        run: |
          cd ios
          pod repo update
          pod install

      # Battle-tested import — avoids brittle openssl extract/repack on runners.
      - name: Import Apple signing certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.P12_PASSWORD }}

      - name: Import signing assets
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail

          if [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::BUILD_PROVISION_PROFILE_BASE64 secret is missing"
          if [ -z "${BUILD_CERTIFICATE_BASE64:-}" ] || [ -z "${P12_PASSWORD:-}" ] || [ -z "${BUILD_PROVISION_PROFILE_BASE64:-}" ]; then
            echo "::error::One or more signing secrets are empty"
            exit 1
          fi

          CERTIFICATE_PATH=$RUNNER_TEMP/dist.p12
          PP_PATH=$RUNNER_TEMP/dist.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          P12_SHA=$(shasum -a 256 "$CERTIFICATE_PATH" | awk '{print $1}')
          echo "P12 size=$(wc -c < "$CERTIFICATE_PATH") sha256=$P12_SHA"

          # This hash is the old Bitrise .p12 that never yields a codesigning identity on CI.
          if [ "$P12_SHA" = "b8c63a47f598b25e22fe7bb8992ff2c4e010dd56762be0c581c8865785befaaa" ]; then
            echo "::error::BUILD_CERTIFICATE_BASE64 is still the OLD broken .p12 (sha256 b8c63a47…)."
            echo "Workflow changes cannot fix this. On the Mac that shows 2 valid identities:"
            echo "  security find-identity -v -p codesigning"
            echo "  # Export THAT 'Apple Distribution: KARINS INTECH…' cert from Keychain as .p12"
            echo "  base64 -i ~/Desktop/KarinsDistribution.p12 | pbcopy"
            echo "  shasum -a 256 ~/Desktop/KarinsDistribution.p12"
            echo "Replace GitHub secret BUILD_CERTIFICATE_BASE64. New sha256 MUST differ from b8c63a47…"
            exit 1
          fi

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          EXISTING_KEYCHAINS=$(security list-keychains -d user | sed -e 's/"//g')
          security list-keychains -d user -s "$KEYCHAIN_PATH" $EXISTING_KEYCHAINS
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$P12_PASSWORD" \
            -A \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/productbuild

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH" >/dev/null

          echo "=== Certificates in temp keychain ==="
          security find-certificate -a -p "$KEYCHAIN_PATH" 2>/dev/null \
            | openssl crl2pkcs7 -nocrl -certfile /dev/stdin 2>/dev/null \
            | openssl pkcs7 -print_certs -noout 2>/dev/null \
            | grep -E 'subject=|issuer=' || true

          echo "=== Codesigning identities ==="
          security find-identity -v -p codesigning
          security find-identity -p codesigning || true

          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -E 'Apple Distribution|iOS Distribution|iPhone Distribution' \
            | head -1 \
            | sed -E 's/.*"(.+)"/\1/')

          if [ -z "$IDENTITY" ]; then
            echo "::error::No valid Distribution identity after import-codesign-certs."
            echo "Export a fresh Apple Distribution .p12 from Keychain (with private key) and update BUILD_CERTIFICATE_BASE64 / P12_PASSWORD."
            exit 1
          fi

          echo "CODE_SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"
          echo "Using identity: $IDENTITY"

          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          security cms -D -i "$PP_PATH" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print Name" "$RUNNER_TEMP/profile.plist")
          cp "$PP_PATH" ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "PROVISIONING_PROFILE_SPECIFIER=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "Installed profile: $PROFILE_NAME ($UUID)"

      - name: Archive App
        run: |
          set -euo pipefail
          mkdir -p build

          xcodebuild archive \
            -workspace ios/karins.xcworkspace \
            -scheme karins \
            -configuration Release \
            -archivePath build/karins.xcarchive \
            -destination "generic/platform=iOS" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_IDENTITY="$CODE_SIGN_IDENTITY" \
            "CODE_SIGN_IDENTITY[sdk=iphoneos*]"="$CODE_SIGN_IDENTITY" \
            PROVISIONING_PROFILE_SPECIFIER="$PROVISIONING_PROFILE_SPECIFIER"

      - name: Create ExportOptions.plist
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>method</key>
          	<string>app-store</string>
          	<key>signingStyle</key>
          	<string>manual</string>
          	<key>teamID</key>
          	<string>${TEAM_ID}</string>
          	<key>provisioningProfiles</key>
          	<dict>
          		<key>${BUNDLE_ID}</key>
          		<string>${PROVISIONING_PROFILE_SPECIFIER}</string>
          	</dict>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^[[:space:]]*//' ExportOptions.plist
          plutil -lint ExportOptions.plist

      - name: Export IPA
        run: |
          xcodebuild -exportArchive \
            -archivePath build/karins.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: karins-ipa
          path: build/*.ipa
